# ===================================================================
# APPLICATION CONFIGURATION
# ===================================================================
spring.application.name=api
server.port=${PORT:8080}

# ===================================================================
# SUPABASE POOLER DATABASE CONFIGURATION
# ===================================================================
# Connects directly to the Singapore AWS Supabase Pooler over SSL
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require&currentSchema=app_api}
spring.datasource.username=${SUPABASE_DB_USER:postgres.cgeswssrhthypcngawmq}
spring.datasource.password=${SUPABASE_DB_PASSWORD:K4emer#100705}

# Ensures our dedicated isolation schema exists before connection initialization
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS app_api

# ===================================================================
# JPA / HIBERNATE ORM CONFIGURATION
# ===================================================================
# Automatically updates your table definitions (adds your new 'role' columns etc.)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=app_api

