# ===================================================================
# SERVLET FILE RUNTIME MANAGEMENT
# ===================================================================
# Prevents large payloads or images from crashing multi-part handlers
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===================================================================
# DEV ROUTE SECURITY BYPASSES
# ===================================================================
